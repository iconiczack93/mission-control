<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<style>
  :root { --ink:#0d0f12; --panel:#161a20; --line:#232833; --txt:#e8e6e1; --dim:#8a919e; --amber:#ffb340; --teal:#2fd5c8; --red:#ff5a4e; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--ink); color:var(--txt); font:14px/1.5 -apple-system, "SF Mono", ui-monospace, monospace; padding:24px 16px 64px; max-width:860px; margin:0 auto; }
  h1 { font-size:20px; letter-spacing:.12em; text-transform:uppercase; }
  h1 span { color:var(--amber); }
  .sub { color:var(--dim); font-size:12px; margin:4px 0 20px; }
  h2 { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--amber); margin:26px 0 10px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; }
  .row { display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:3px 0; align-items:baseline; }
  .name { font-weight:600; font-size:13px; }
  .what { color:var(--dim); font-size:12px; grid-column:1; }
  .next { color:var(--teal); font-size:11px; text-align:right; white-space:nowrap; }
  .note { color:var(--dim); font-size:11px; }
  .date { color:var(--amber); font-weight:700; font-size:12px; min-width:78px; display:inline-block; }
  .who { color:var(--teal); font-size:11px; }
  .locked { color:var(--dim); font-size:12px; }
  #lockbox input { background:#0a0c0f; border:1px solid var(--line); color:var(--txt); padding:8px 10px; border-radius:8px; font:inherit; width:120px; }
  #lockbox button { background:var(--amber); color:var(--ink); border:0; padding:8px 14px; border-radius:8px; font:inherit; font-weight:700; cursor:pointer; }
  .foot { color:var(--dim); font-size:11px; margin-top:22px; }
  a { color:var(--teal); text-decoration:none; }
</style>
</head>

</div>

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function render(D){
  document.getElementById('updated').textContent = 'rebuilt ' + D.ts;
  const b = document.getElementById('board');
  let h = '';
  h += '<h2>Active watches</h2>';
  h += D.watches.map(w=>`<div class="card"><div class="row"><span class="name">${esc(w.name)}</span><span class="next">${esc(w.next)}</span><span class="what">${esc(w.what)}${w.link?` · <a href="${w.link}" target="_blank">dashboard</a>`:''}</span><span class="next">${esc(w.cadence)}</span></div>${w.note?`<div class="note">${esc(w.note)}</div>`:''}</div>`).join('');
  h += '<h2>Upcoming dates</h2><div class="card">';
  h += D.dates.map(x=>`<div class="row" style="grid-template-columns:78px 1fr auto"><span class="date">${esc(x.d)}</span><span class="name">${esc(x.label)}</span><span class="note">${esc(x.note)}</span></div>`).join('');
  h += '</div>';
  h += '<h2>Open decisions</h2><div class="card">';
  h += D.decisions.map(x=>`<div class="row" style="grid-template-columns:1fr auto"><span class="name">${esc(x.label)}</span><span class="who">waiting: ${esc(x.waiting)}</span>${x.note?`<span class="note" style="grid-column:1">${esc(x.note)}</span>`:''}</div>`).join('');
  h += '</div>';
  h += '<h2>Recently landed</h2><div class="card">';
  h += D.landed.map(x=>`<div class="row" style="grid-template-columns:78px 1fr auto"><span class="date">${esc(x.d)}</span><span class="name">${esc(x.label)}</span><span class="note">${esc(x.note)}</span></div>`).join('');
  h += '</div>';
  h += '<h2>Proposed new watches</h2><div class="card">';
  h += D.proposed.map(x=>`<div class="row" style="grid-template-columns:1fr auto"><span class="name">${esc(x.idea)}</span><span class="note">${esc(x.note)}</span></div>`).join('');
  h += '</div>';
  b.innerHTML = h;
  b.style.display = 'block';
  document.getElementById('lockbox').style.display = 'none';
}
async function unlock(){
  const pin=document.getElementById('pin').value, err=document.getElementById('perr');
  try{
    const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.iv)},key,b64(BLOB.data));
    render(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){ err.textContent='wrong pin (or bad decrypt)'; }
}
document.getElementById('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') unlock(); });
</script>
